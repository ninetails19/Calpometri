<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator Antropometri</title>
<style>
  :root{
    --paper:#F2F6F3;
    --paper-raised:#FFFFFF;
    --ink:#1B2A22;
    --ink-soft:#4C5C53;
    --forest:#1F5C4C;
    --forest-dark:#123B30;
    --sage:#E1EBE4;
    --line:#CBD8CF;
    --brick:#9C3D2E;
    --brick-bg:#F6E7E3;
    --amber:#96661C;
    --amber-bg:#F3E8D3;
    --gold:#B78B2E;
    --gold-bg:#F1E7D0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    padding:40px 16px 64px;
    display:flex;
    justify-content:center;
  }
  .sheet{
    width:100%;
    max-width:640px;
  }
  .masthead{
    padding-bottom:22px;
    border-bottom:2px solid var(--forest);
    margin-bottom:28px;
  }
  .masthead h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:32px;
    line-height:1.15;
    margin:0 0 8px;
    color:var(--forest-dark);
    letter-spacing:-0.01em;
  }
  .masthead p{
    margin:0;
    font-size:14.5px;
    color:var(--ink-soft);
    max-width:46ch;
  }

  .section-label{
    font-size:13px;
    font-weight:600;
    color:var(--forest-dark);
    margin:0 0 14px;
    padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }

  form{
    background:var(--paper-raised);
    border:1px solid var(--line);
    padding:26px 24px 24px;
    margin-bottom:24px;
  }

  .field{ margin-bottom:16px; }
  .field label{
    display:block;
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .row{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .row3{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  input, select{
    width:100%;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:15px;
    padding:10px 12px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    border-radius:2px;
  }
  input:focus, select:focus{
    outline:none;
    border-color:var(--forest);
    background:#fff;
  }
  input::placeholder{ color:#9AA79E; }

  button{
    width:100%;
    margin-top:6px;
    background:var(--forest);
    color:#F2F6F3;
    border:none;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:15px;
    padding:13px;
    cursor:pointer;
    letter-spacing:0.01em;
  }
  button:hover{ background:var(--forest-dark); }

  /* ================= RESULT CARD ================= */
  #resultCard{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-top:4px solid var(--forest);
  }
  #resultCard.hidden{ display:none; }

  .result-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    padding:22px 24px 18px;
    border-bottom:1px solid var(--line);
  }
  .result-head h2{
    font-family:'Fraunces', serif;
    font-size:22px;
    font-weight:600;
    margin:0 0 4px;
    color:var(--ink);
  }
  .result-head .bio{
    font-size:13px;
    color:var(--ink-soft);
  }
  .badge{
    flex-shrink:0;
    font-size:12px;
    font-weight:600;
    padding:6px 12px;
    white-space:nowrap;
    border:1px solid transparent;
  }

  .stat-row{
    display:grid;
    grid-template-columns:1fr 1fr;
  }
  .stat{
    padding:22px 24px;
    text-align:left;
  }
  .stat:first-child{ border-right:1px solid var(--line); }
  .stat .stat-label{
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .stat .stat-value{
    font-family:'Fraunces', serif;
    font-size:34px;
    font-weight:500;
    color:var(--forest-dark);
    line-height:1;
  }
  .stat .stat-unit{
    font-size:14px;
    color:var(--ink-soft);
    margin-left:4px;
  }

  /* SD ruler */
  .ruler-wrap{
    padding:22px 24px 24px;
    border-top:1px solid var(--line);
  }
  .ruler-title{
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:14px;
  }
  .ruler{
    position:relative;
    height:34px;
    display:flex;
  }
  .ruler .zone{
    flex:1;
    position:relative;
    border-right:1px solid rgba(255,255,255,0.6);
  }
  .ruler .zone:last-child{ border-right:none; }
  .zone.z-severe{ background:#C9584A; }
  .zone.z-mild{ background:#D9A94A; }
  .zone.z-normal{ background:#3E8E6E; }
  .zone.z-risk{ background:#D9A94A; }
  .zone.z-over{ background:#C9584A; }

  .ruler-labels{
    display:flex;
    margin-top:6px;
  }
  .ruler-labels span{
    flex:1;
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
  }
  .marker{
    position:absolute;
    top:-9px;
    width:0; height:0;
    border-left:7px solid transparent;
    border-right:7px solid transparent;
    border-top:9px solid var(--ink);
    transform:translateX(-50%);
  }
  .marker-line{
    position:absolute;
    top:0;
    bottom:0;
    width:2px;
    background:var(--ink);
    transform:translateX(-1px);
  }

  .sd-table{
    width:100%;
    border-collapse:collapse;
    margin-top:16px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
  }
  .sd-table th, .sd-table td{
    border:1px solid var(--line);
    text-align:center;
    padding:6px 2px;
    color:var(--ink-soft);
  }
  .sd-table th.median, .sd-table td.median{
    background:var(--sage);
    color:var(--forest-dark);
    font-weight:600;
  }

  .desc-block{
    padding:20px 24px 24px;
    border-top:1px solid var(--line);
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.55;
  }

  .notice{
    margin:0 24px 22px;
    padding:14px 16px;
    font-size:13px;
    line-height:1.5;
    border-left:3px solid var(--amber);
    background:var(--amber-bg);
    color:#5C4419;
  }
  .notice.danger{
    border-left-color:var(--brick);
    background:var(--brick-bg);
    color:#5C271C;
  }
  .notice strong{ display:block; margin-bottom:3px; font-weight:600; }

  .method-note{
    margin:24px 0 0;
    font-size:12px;
    color:var(--ink-soft);
    line-height:1.6;
    padding-top:16px;
    border-top:1px dashed var(--line);
  }

  .index-wrap{
    padding:20px 24px 4px;
    border-top:1px solid var(--line);
  }
  .index-title{
    font-size:12px;
    color:var(--ink-soft);
    margin:0 0 12px;
  }
  .index-table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
  }
  .index-table th, .index-table td{
    border:1px solid var(--line);
    padding:8px 10px;
    text-align:left;
  }
  .index-table th{
    background:var(--sage);
    color:var(--forest-dark);
    font-weight:600;
    font-size:12px;
  }
  .index-table td.idx-name{ color:var(--ink); font-weight:500; }
  .index-table td.idx-z{ font-family:'IBM Plex Mono', monospace; color:var(--ink-soft); white-space:nowrap; }
  .index-table td.idx-cat{ white-space:nowrap; }
  .index-pill{
    display:inline-block;
    font-size:11.5px;
    font-weight:600;
    padding:3px 9px;
    border:1px solid transparent;
  }

  @media (max-width:480px){
    .row, .stat-row{ grid-template-columns:1fr; }
    .stat:first-child{ border-right:none; border-bottom:1px solid var(--line); }
    .masthead h1{ font-size:26px; }
    .index-table{ font-size:12px; }
    .index-table th, .index-table td{ padding:6px 6px; }
  }
  </style>
</head>
<body>

<div class="sheet">

  <div class="masthead">
    <h1>Kalkulator antropometri</h1>
  </div>

  <form id="antropometriForm">
    <p class="section-label">Data Pasien</p>

    <div class="field">
      <label for="nama">Nama lengkap</label>
      <input type="text" id="nama" placeholder="Masukkan nama">
    </div>

    <div class="row">
      <div class="field">
        <label for="gender">Jenis kelamin</label>
        <select id="gender" required>
          <option value="L">Laki-laki</option>
          <option value="P">Perempuan</option>
        </select>
      </div>
      <div class="field">
        <label>Umur</label>
        <div class="row3">
          <input type="number" id="umurTahun" min="0" max="100" placeholder="Tahun" required>
          <input type="number" id="umurBulan" min="0" max="11" placeholder="Bulan" value="0" required>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label for="tb">Tinggi/panjang badan (cm)</label>
        <input type="number" id="tb" step="0.1" placeholder="Contoh: 110" required>
      </div>
      <div class="field">
        <label for="bb">Berat badan (kg)</label>
        <input type="number" id="bb" step="0.1" placeholder="Contoh: 18.5" required>
      </div>
    </div>

    <button type="submit">Hitung status gizi</button>
  </form>

  <div id="resultCard" class="hidden">
    <div class="result-head">
      <div>
        <h2 id="resNama"></h2>
        <div class="bio" id="resBio"></div>
      </div>
      <span class="badge" id="resCategory"></span>
    </div>

    <div class="stat-row">
      <div class="stat">
        <div class="stat-label">IMT</div>
        <div class="stat-value" id="resBmiValue"></div>
      </div>
      <div class="stat">
        <div class="stat-label">Z-score IMT/U (perkiraan)</div>
        <div class="stat-value" id="resZScoreValue"></div>
      </div>
    </div>

    <div id="coverageNotice"></div>

    <div id="indexWrap" class="index-wrap">
      <table class="index-table">
        <thead>
          <tr><th>Indeks</th><th>Z-score</th><th>Kategori</th></tr>
        </thead>
        <tbody id="indexTableBody"></tbody>
      </table>
    </div>

    <div id="rulerSection" class="ruler-wrap">
      <p class="ruler-title">Posisi pada skala standar deviasi IMT/U</p>
      <div class="ruler" id="rulerBar">
        <div class="zone z-severe"></div>
        <div class="zone z-mild"></div>
        <div class="zone z-normal"></div>
        <div class="zone z-normal"></div>
        <div class="zone z-risk"></div>
        <div class="zone z-over"></div>
        <div class="marker-line" id="markerLine"></div>
        <div class="marker" id="markerTri"></div>
      </div>
      <div class="ruler-labels">
        <span>-3 SD</span><span>-2 SD</span><span>-1 SD</span><span>Median</span><span>+1 SD</span><span>+2 SD</span><span>+3 SD</span>
      </div>

      <table class="sd-table">
        <thead>
          <tr>
            <th>-3 SD</th><th>-2 SD</th><th>-1 SD</th><th class="median">Median</th><th>+1 SD</th><th>+2 SD</th><th>+3 SD</th>
          </tr>
        </thead>
        <tbody id="sdTableBody"></tbody>
      </table>
    </div>

    <div class="desc-block" id="resDesc"></div>
  </div>
</div>

  const A_MIN = 0, A_MAX = 60;
  const B_MIN = 61, B_MAX = 228;

  const badgeColors = {
    sev:  'background:var(--brick-bg); color:var(--brick); border-color:var(--brick);',
    mild: 'background:var(--amber-bg); color:var(--amber); border-color:var(--amber);',

  };

  // Ambil array nilai SD (kg/m2) untuk bulan & jenis kelamin tertentu (indeks IMT/U).
  function getSDRow(totalBulan, genderKey) {
    if (totalBulan <= A_MAX) {
      return { values: NUTRI.A[genderKey][totalBulan], hasSD3pos: true };
    }
    const idx = totalBulan - B_MIN;
    return { values: NUTRI.B[genderKey][idx], hasSD3pos: false };
  }

  // Baris tabel BB/U atau PB/U-TB/U untuk bulan usia tertentu (0-60 bulan, indeks bulan langsung).
  function monthRow(table, genderKey, ageMonths) {
    const m = Math.max(0, Math.min(60, Math.round(ageMonths)));
    return table[genderKey][m];
  }

  // Interpolasi baris BB/PB atau BB/TB berdasarkan panjang/tinggi badan (cm).
  // Memakai tabel PB (panjang, telentang) untuk usia <24 bulan, TB (tinggi, berdiri) untuk usia >=24 bulan.
  function interpolateBBIndex(genderKey, ageMonths, heightCm) {
    const which = ageMonths < 24 ? 'pb' : 'tb';
    const table = BBPBTB[genderKey][which];
    const startCm = which === 'pb' ? 45.0 : 65.0;
    const step = 0.5;
    const n = table.length;
    let idxFloat = (heightCm - startCm) / step;
    idxFloat = Math.max(0, Math.min(n - 1, idxFloat));
    const i0 = Math.floor(idxFloat);
    const i1 = Math.min(n - 1, i0 + 1);
    const frac = idxFloat - i0;
    const row0 = table[i0], row1 = table[i1];
    return row0.map((v, k) => v + (row1[k] - v) * frac);
  }

  function fmt(n) { return Math.round(n * 10) / 10; }

  // Interpolasi Z-score dari suatu nilai terhadap array ambang SD (7 atau 6 nilai, median di tengah).
  function computeZ(val, sdValues) {
    const medianIdx = Math.floor(sdValues.length / 2);
    const median = sdValues[medianIdx];
    if (val >= median) {
      for (let i = medianIdx; i < sdValues.length - 1; i++) {
        if (val <= sdValues[i + 1] || i === sdValues.length - 2) {
          const zLow = i - medianIdx, zHigh = i + 1 - medianIdx;
          const frac = (val - sdValues[i]) / (sdValues[i + 1] - sdValues[i]);
          return zLow + frac * (zHigh - zLow);
        }
      }
    } else {
      for (let i = medianIdx; i > 0; i--) {
        if (val >= sdValues[i - 1] || i === 1) {
          const zHigh = i - medianIdx, zLow = i - 1 - medianIdx;
          const frac = (val - sdValues[i - 1]) / (sdValues[i] - sdValues[i - 1]);
          return zLow + frac * (zHigh - zLow);
        }
      }
    }
    return 0;
  }

  // Kategori BB/U (Permenkes No. 2/2020, usia 0-60 bulan)
  function catBBU(z) {
    if (z < -3) return { kat: 'Berat badan sangat kurang', cls: 'sev' };
    if (z < -2) return { kat: 'Berat badan kurang', cls: 'mild' };
    if (z <= 1) return { kat: 'Berat badan normal', cls: 'ok' };
    return { kat: 'Risiko berat badan lebih', cls: 'risk' };
  }

  // Kategori PB/U atau TB/U (Permenkes No. 2/2020, usia 0-60 bulan)
  function catPBTBU(z) {
    if (z < -3) return { kat: 'Sangat pendek (severely stunted)', cls: 'sev' };
    if (z < -2) return { kat: 'Pendek (stunted)', cls: 'mild' };
    if (z <= 3) return { kat: 'Normal', cls: 'ok' };
    return { kat: 'Tinggi', cls: 'tall' };
  }

  // Kategori bersama untuk BB/PB-BB/TB dan IMT/U usia 0-60 bulan (ambang batas sama persis di Permenkes No. 2/2020)
  function catGiziIndex(z) {
    if (z < -3) return { kat: 'Gizi buruk (severely wasted)', cls: 'sev' };
    if (z < -2) return { kat: 'Gizi kurang (wasted)', cls: 'mild' };
    if (z <= 1) return { kat: 'Gizi baik (normal)', cls: 'ok' };
    if (z <= 2) return { kat: 'Berisiko gizi lebih (possible risk of overweight)', cls: 'risk' };
    if (z <= 3) return { kat: 'Gizi lebih (overweight)', cls: 'over' };
    return { kat: 'Obesitas (obese)', cls: 'over' };
  }

  document.getElementById('antropometriForm').addEventListener('submit', function (e) {
    e.preventDefault();

    const nama = document.getElementById('nama').value;
    const gender = document.getElementById('gender').value;
    const genderKey = gender === 'L' ? 'L' : 'P';
    const thn = parseInt(document.getElementById('umurTahun').value) || 0;
    const bln = parseInt(document.getElementById('umurBulan').value) || 0;
    const tbCm = parseFloat(document.getElementById('tb').value);
    const bb = parseFloat(document.getElementById('bb').value);

    const totalBulan = (thn * 12) + bln;
    const tbM = tbCm / 100;
    const imt = bb / (tbM * tbM);

    let kategori = '', zScoreText = 'N/A', badgeClass = '', deskripsi = '';
    let showRuler = false, coverageHTML = '';
    const rulerSection = document.getElementById('rulerSection');
    const coverageNotice = document.getElementById('coverageNotice');
    const rulerBar = document.getElementById('rulerBar');
    const indexWrap = document.getElementById('indexWrap');
    const indexTableBody = document.getElementById('indexTableBody');
    indexWrap.style.display = 'none';
    indexTableBody.innerHTML = '';

    if (totalBulan <= B_MAX) {
      const clampedBulan = Math.max(A_MIN, Math.min(B_MAX, totalBulan));
      const { values: sdValues, hasSD3pos } = getSDRow(clampedBulan, genderKey);
      // Ruler/tabel SD IMT/U hanya ditampilkan untuk usia >60 bulan;
      // untuk balita (0-60 bulan) IMT/U sudah tercakup di tabel empat indeks.
      showRuler = !hasSD3pos;

      const labels = hasSD3pos
        ? ['-3 SD', '-2 SD', '-1 SD', 'Median', '+1 SD', '+2 SD', '+3 SD']
        : ['-3 SD', '-2 SD', '-1 SD', 'Median', '+1 SD', '+2 SD'];
      document.querySelector('.sd-table thead tr').innerHTML =
        labels.map((l, i) => `<th${i === 3 ? ' class="median"' : ''}>${l}</th>`).join('');
      document.getElementById('sdTableBody').innerHTML =
        `<tr>${sdValues.map(v => `<td>${fmt(v)}</td>`).join('')}</tr>`;

      rulerBar.querySelectorAll('.zone').forEach(z => z.remove());
      const zoneClasses = hasSD3pos
        ? ['z-severe', 'z-mild', 'z-normal', 'z-normal', 'z-risk', 'z-over']
        : ['z-severe', 'z-mild', 'z-normal', 'z-normal', 'z-risk'];
      zoneClasses.forEach(cls => {
        const d = document.createElement('div');
        d.className = 'zone ' + cls;
        rulerBar.insertBefore(d, document.getElementById('markerLine'));
      });
      const rulerMin = -3, rulerMax = hasSD3pos ? 3 : 2;
      document.querySelector('.ruler-labels').innerHTML =
        labels.map(l => `<span>${l}</span>`).join('');

      let zScore = computeZ(imt, sdValues);
      zScoreText = (zScore >= 0 ? '+' : '') + zScore.toFixed(2) + ' SD';

      const clampedZ = Math.max(rulerMin - 0.5, Math.min(rulerMax + 0.5, zScore));
      const pct = ((clampedZ - (rulerMin - 0.5)) / ((rulerMax + 0.5) - (rulerMin - 0.5))) * 100;
      document.getElementById('markerLine').style.left = pct + '%';
      document.getElementById('markerTri').style.left = pct + '%';

      if (hasSD3pos) {
        // Klasifikasi IMT/U 0-60 bulan (Permenkes 2/2020, WHO Child Growth Standards)
        const cIMT = catGiziIndex(zScore);
        kategori = cIMT.kat; badgeClass = cIMT.cls;
        deskripsi = 'Indeks Massa Tubuh menurut Umur (IMT/U): ' + cIMT.kat + '. Penentuan status gizi balita perlu memperhatikan keempat indeks (BB/U, PB/U atau TB/U, BB/PB atau BB/TB, dan IMT/U) secara bersamaan, lihat tabel di bawah.';

        // Hitung tiga indeks tambahan khusus balita 0-60 bulan
        const bbuRow = monthRow(BBU, genderKey, totalBulan);
        const zBBU = computeZ(bb, bbuRow);
        const cBBU = catBBU(zBBU);

        const pbtbuRow = monthRow(PBTBU, genderKey, totalBulan);
        const zPBTBU = computeZ(tbCm, pbtbuRow);
        const cPBTBU = catPBTBU(zPBTBU);

        const bbpbtbRow = interpolateBBIndex(genderKey, totalBulan, tbCm);
        const zBBPBTB = computeZ(bb, bbpbtbRow);
        const cBBPBTB = catGiziIndex(zBBPBTB);

        const rows = [
          ['BB/U (Berat Badan menurut Umur)', zBBU, cBBU],
          ['PB/U atau TB/U (Panjang/Tinggi Badan menurut Umur)', zPBTBU, cPBTBU],
          ['BB/PB atau BB/TB (Berat Badan menurut Panjang/Tinggi Badan)', zBBPBTB, cBBPBTB],
          ['IMT/U (Indeks Massa Tubuh menurut Umur)', zScore, cIMT]
        ];
        indexTableBody.innerHTML = rows.map(r => {
          const label = r[0], z = r[1], c = r[2];
          const zTxt = (z >= 0 ? '+' : '') + z.toFixed(2) + ' SD';
          return '<tr><td class="idx-name">' + label + '</td><td class="idx-z">' + zTxt + '</td><td class="idx-cat"><span class="index-pill" style="' + (badgeColors[c.cls] || '') + '">' + c.kat + '</span></td></tr>';
        }).join('');
        indexWrap.style.display = 'block';
      } else {
        // Klasifikasi IMT/U 61-228 bulan (2007 WHO Reference 5-19 tahun, tanpa jenjang +3 SD)
        if (zScore < -3) {
          kategori = 'Gizi buruk'; badgeClass = 'sev';
          deskripsi = 'Berada di bawah -3 SD (severe thinness). Memerlukan penanganan gizi oleh tenaga kesehatan.';
        } else if (zScore < -2) {
          kategori = 'Gizi kurang'; badgeClass = 'mild';
          deskripsi = 'Berada pada rentang -3 SD hingga di bawah -2 SD (thinness). Perlu perhatian pada asupan nutrisi.';
        } else if (zScore <= 1) {
          kategori = 'Gizi baik'; badgeClass = 'ok';
          deskripsi = 'Status gizi berada dalam rentang normal, -2 SD hingga +1 SD.';
        } else if (zScore <= 2) {
          kategori = 'Gizi lebih'; badgeClass = 'risk';
          deskripsi = 'Berada di atas +1 SD hingga +2 SD (overweight). Pantau pola makan dan aktivitas fisik.';
        } else {
          kategori = 'Obesitas'; badgeClass = 'over';
          deskripsi = 'Berada di atas +2 SD (obesity). Disarankan konsultasi ke dokter atau ahli gizi.';
        }
      }

      coverageHTML = '';

    } else {
      // DEWASA (>228 bulan, di atas 19 tahun — di luar cakupan tabel anak IMT/U resmi;
      // untuk usia ini dipakai klasifikasi Kemenkes dewasa)
      showRuler = false;
      zScoreText = 'Tidak berlaku';

      if (imt < 17.0) {
        kategori = 'Sangat kurus'; badgeClass = 'sev';
        deskripsi = 'Kekurangan berat badan tingkat berat.';
      } else if (imt <= 18.4) {
        kategori = 'Kurus'; badgeClass = 'mild';
        deskripsi = 'Kekurangan berat badan tingkat ringan.';
      } else if (imt <= 25.0) {
        kategori = 'Normal'; badgeClass = 'ok';
        deskripsi = 'Berat badan proporsional dan berada pada rentang sehat.';
      } else if (imt <= 27.0) {
        kategori = 'Gemuk'; badgeClass = 'risk';
        deskripsi = 'Kelebihan berat badan tingkat ringan.';
      } else {
        kategori = 'Obesitas'; badgeClass = 'over';
        deskripsi = 'Kelebihan berat badan tingkat berat.';
      }

      coverageHTML = '';
    }

    document.getElementById('resNama').textContent = nama;
    document.getElementById('resBio').textContent =
      `${gender === 'L' ? 'Laki-laki' : 'Perempuan'} — ${thn} tahun ${bln} bulan (${totalBulan} bulan)`;
    document.getElementById('resBmiValue').innerHTML = `${fmt(imt)}<span class="stat-unit">kg/m²</span>`;
    document.getElementById('resZScoreValue').textContent = zScoreText;

    const badge = document.getElementById('resCategory');
    badge.textContent = kategori;
    badge.setAttribute('style', badgeColors[badgeClass] || '');

    document.getElementById('resDesc').textContent = deskripsi;
    coverageNotice.innerHTML = coverageHTML;
    rulerSection.style.display = showRuler ? 'block' : 'none';

    document.getElementById('resultCard').classList.remove('hidden');
    document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });

</script>
